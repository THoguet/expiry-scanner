[package]
name = "api"
version = "0.2.0"
edition = "2021"

[dependencies]
# The Web Framework
axum = "0.8.8"

tower-http = { version = "0.6.8", features = ["cors", "fs"] }

# The Async Runtime (The engine that runs your code)
# "full" enables all features like file I/O, networking, and time.
tokio = { version = "1.0", features = ["full"] }

# Serialization (JSON <-> Rust Structs)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging (Crucial for debugging async code)
tracing = "0.1"
tracing-subscriber = "0.3"

# Database (Async Postgres driver)
# "runtime-tokio" tells it to use the Tokio engine we discussed.
# "macros" allows us to write SQL directly in Rust code.
sqlx = { version = "0.8.6", features = [
	"runtime-tokio",
	"tls-native-tls",
	"postgres",
	"macros",
	"chrono",
	"uuid",
] }

# Environment Variables (To read .env files)
dotenvy = "0.15"

# Date & Time (Compatible with SQLx)
chrono = { version = "0.4", features = ["serde"] }

uuid = { version = "1.23.0", features = ["serde", "v4"] }
ts-rs = { version = "12.0.1", features = [
	"chrono-impl",
	"uuid-impl",
	"serde-json-impl",
	"format",
	"tokio-impl",
] }
clap = { version = "4.5.60", features = ["derive"] }
csv = "1.3.1"
image = { version = "0.25.8", default-features = false, features = [
	"jpeg",
	"png",
	"webp",
] }
base64 = "0.22.1"
tokio-cron-scheduler = "0.15.1"
