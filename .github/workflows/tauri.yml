name: Mobile

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/tauri.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/tauri.yml"

jobs:
  check-mobile:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1

      - name: Install frontend dependencies
        working-directory: ./mobile
        run: bun install

      - name: Run tests
        working-directory: ./mobile
        run: bun run test

      - name: Generate coverage report
        working-directory: ./mobile
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./mobile/coverage/coverage-final.json
          flags: mobile
          fail_ci_if_error: false

      - name: Build frontend
        working-directory: ./mobile
        run: bun run build

      - name: Check Rust code
        working-directory: ./mobile/src-tauri
        run: cargo check --locked

  # ── Build (All Branches) & Release (Main Branch + Android Only) ──────────────
  build-and-release:
    name: Build & Release ${{ matrix.mobile }}
    needs: check-mobile
    permissions:
      contents: write # required to create GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            mobile: android
            rust-targets: aarch64-linux-android
            args: "--apk --aab"
          # - platform: macos-latest
          #   mobile: ios
          #   rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # -- 1. Setup Environment --
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1

      - name: Install frontend dependencies
        working-directory: ./mobile
        run: bun install

      - name: Setup Android signing
        if: matrix.mobile == 'android'
        working-directory: mobile/src-tauri/gen/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          # Decode the base64 keystore into a secure runner temp directory
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      # -- 2. Build the App Manually --
      - name: Build mobile app
        working-directory: ./mobile
        run: bun tauri ${{ matrix.mobile }} build ${{ matrix.args }}

      # -- 3. Upload Artifacts (Runs on all branches) --
      - name: Upload Android Artifacts
        if: matrix.mobile == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            mobile/src-tauri/gen/android/app/build/outputs/**/*.apk
            mobile/src-tauri/gen/android/app/build/outputs/**/*.aab
          retention-days: 7

      # -- 4. Create Release (Runs ONLY on main branch for Android) --
      - name: Extract App Version
        if: github.ref == 'refs/heads/main' && matrix.mobile == 'android'
        id: version
        working-directory: ./mobile/src-tauri
        run: echo "VERSION=$(node -p "require('./tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && matrix.mobile == 'android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.version.outputs.VERSION }}
          name: Mobile v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's new
            See commit history for changes in this release.

            ## Install
            **Android**: download the `.apk` below and sideload it.
            The `.aab` is also attached for store distribution workflows.
          files: |
            mobile/src-tauri/gen/android/app/build/outputs/**/*.apk
            mobile/src-tauri/gen/android/app/build/outputs/**/*.aab

      - name: Publish to Play Store (internal track)
        if: github.ref == 'refs/heads/main' && matrix.mobile == 'android'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nessar.expiry_scanner
          releaseFiles: mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          track: internal
