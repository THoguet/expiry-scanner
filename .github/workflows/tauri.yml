name: Mobile

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/tauri.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/tauri.yml"

jobs:
  check-mobile:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1

      - name: Install frontend dependencies
        working-directory: ./mobile
        run: bun install

      - name: Run tests
        working-directory: ./mobile
        run: bun run test

      - name: Generate coverage report
        working-directory: ./mobile
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./mobile/coverage/coverage-final.json
          flags: mobile
          fail_ci_if_error: false

      - name: Build frontend
        working-directory: ./mobile
        run: bun run build

      - name: Check Rust code
        working-directory: ./mobile/src-tauri
        run: cargo check --locked

  # ── Build (All Branches) & Release (Main Branch + Android Only) ──────────────
  build-and-release:
    name: Build & Release ${{ matrix.mobile }}
    needs: check-mobile
    permissions:
      contents: write # required to create GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            mobile: android
            rust-targets: aarch64-linux-android
            args: "--apk"
          # - platform: macos-latest
          #   mobile: ios
          #   rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -- 1. Setup Environment --
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Java
        if: matrix.mobile == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.mobile == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1

      - name: Install frontend dependencies
        working-directory: ./mobile
        run: bun install

      - name: Setup Android signing
        if: matrix.mobile == 'android'
        working-directory: mobile/src-tauri/gen/android
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          # Decode the base64 keystore into a secure runner temp directory
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Resolve mobile build version
        id: version
        if: matrix.mobile == 'android'
        run: |
          TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' | head -n 1 || true)"

          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
            OFFICIAL="true"
            RELEASE_TAG="$TAG"
          else
            VERSION="0.0.0-dev"
            OFFICIAL="false"
            RELEASE_TAG=""
          fi

          CORE_VERSION="$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          MAJOR="$(echo "$CORE_VERSION" | cut -d'.' -f1)"
          MINOR="$(echo "$CORE_VERSION" | cut -d'.' -f2)"
          PATCH="$(echo "$CORE_VERSION" | cut -d'.' -f3)"

          if [ "$OFFICIAL" = "true" ]; then
            VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          else
            VERSION_CODE=1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "OFFICIAL=$OFFICIAL" >> "$GITHUB_OUTPUT"

      - name: Sync mobile version files
        if: matrix.mobile == 'android'
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.ANDROID_VERSION_CODE }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const appVersion = process.env.APP_VERSION;
          const androidVersionCode = process.env.ANDROID_VERSION_CODE;

          const pkgPath = 'mobile/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = appVersion;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, '\t') + '\n');

          const cargoPath = 'mobile/src-tauri/Cargo.toml';
          let cargo = fs.readFileSync(cargoPath, 'utf8');
          cargo = cargo.replace(/^(version\s*=\s*")[^"]+("\s*)$/m, `$1${appVersion}$2`);
          fs.writeFileSync(cargoPath, cargo);

          const tauriConfPath = 'mobile/src-tauri/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriConfPath, 'utf8'));
          tauri.version = appVersion;
          fs.writeFileSync(tauriConfPath, JSON.stringify(tauri, null, '\t') + '\n');

          const tauriPropsPath = 'mobile/src-tauri/gen/android/app/tauri.properties';
          let props = fs.readFileSync(tauriPropsPath, 'utf8');

          if (/(^|\n)tauri\.android\.versionName=/.test(props)) {
            props = props.replace(/(^|\n)tauri\.android\.versionName=.*/, `$1tauri.android.versionName=${appVersion}`);
          } else {
            props += `\ntauri.android.versionName=${appVersion}`;
          }

          if (/(^|\n)tauri\.android\.versionCode=/.test(props)) {
            props = props.replace(/(^|\n)tauri\.android\.versionCode=.*/, `$1tauri.android.versionCode=${androidVersionCode}`);
          } else {
            props += `\ntauri.android.versionCode=${androidVersionCode}`;
          }

          fs.writeFileSync(tauriPropsPath, props.endsWith('\n') ? props : `${props}\n`);
          NODE

      # -- 2. Build the App Manually --
      - name: Build mobile app
        working-directory: ./mobile
        run: bun tauri ${{ matrix.mobile }} build ${{ matrix.args }}

      # -- 3. Upload Artifacts (Runs on all branches) --
      - name: Upload APK Artifact
        if: matrix.mobile == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/src-tauri/gen/android/app/build/outputs/**/*.apk
          retention-days: 7

      # -- 4. Create Release (Runs ONLY on main branch for Android) --
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && matrix.mobile == 'android' && steps.version.outputs.OFFICIAL == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.RELEASE_TAG }}
          name: Mobile v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's new
            See commit history for changes in this release.

            ## Install
            **Android**: download the `.apk` below and sideload it.
          files: mobile/src-tauri/gen/android/app/build/outputs/**/*.apk
