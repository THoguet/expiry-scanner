name: Mobile

on:
    push:
        branches: ["**"]
        paths:
            - "mobile/**"
            - ".github/workflows/tauri.yml"
    pull_request:
        branches: ["**"]
        paths:
            - "mobile/**"
            - ".github/workflows/tauri.yml"

jobs:
    check-mobile:
        name: Check
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: mobile/src-tauri

            - name: Install system dependencies
              uses: awalsh128/cache-apt-pkgs-action@v1
              with:
                  packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                  version: 1

            - name: Install frontend dependencies
              working-directory: ./mobile
              run: bun install

            - name: Build frontend
              working-directory: ./mobile
              run: bun run build

            - name: Check Rust code
              working-directory: ./mobile/src-tauri
              run: cargo check --locked

    # ── Build (All Branches) & Release (Main Branch + Android Only) ──────────────
    build-and-release:
        name: Build & Release ${{ matrix.mobile }}
        needs: check-mobile
        permissions:
            contents: write # required to create GitHub Releases
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: ubuntu-22.04
                      mobile: android
                      rust-targets: aarch64-linux-android
                      args: "--apk"
                    - platform: macos-latest
                      mobile: ios
                      rust-targets: aarch64-apple-ios,aarch64-apple-ios-sim
                      args: "--target aarch64-apple-ios-sim"

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1

            - name: Setup Java
              if: matrix.mobile == 'android'
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Setup Android SDK
              if: matrix.mobile == 'android'
              uses: android-actions/setup-android@v3

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust-targets }}

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: mobile/src-tauri

            - name: Install frontend dependencies
              working-directory: ./mobile
              run: bun install

            - name: Install system dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-22.04'
              uses: awalsh128/cache-apt-pkgs-action@v1
              with:
                  packages: libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                  version: 1

            - name: Build and potentially release mobile app
              uses: tauri-apps/tauri-action@v0 # Upgraded to track the stable v0.x
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # ANDROID_SIGNING_KEY:          ${{ secrets.ANDROID_SIGNING_KEY }}
                  # ANDROID_KEY_STORE_PASSWORD:   ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
                  # ANDROID_KEY_PASSWORD:         ${{ secrets.ANDROID_KEY_PASSWORD }}
                  # ANDROID_KEY_ALIAS:            ${{ secrets.ANDROID_KEY_ALIAS }}
              with:
                  projectPath: ./mobile
                  tauriScript: bun tauri ${{ matrix.mobile }}
                  args: ${{ matrix.args }}
                  uploadWorkflowArtifacts: true
                  # Dynamically provide a tagName ONLY if we are on main branch AND building Android.
                  # If this evaluates to '', tauri-action builds but completely skips the release step.
                  tagName: ${{ github.ref == 'refs/heads/main' && matrix.mobile == 'android' && 'mobile-v__VERSION__' || '' }}
                  releaseName: ${{ github.ref == 'refs/heads/main' && matrix.mobile == 'android' && 'Mobile v__VERSION__' || '' }}
                  releaseBody: |
                      ## What's new
                      See commit history for changes in this release.

                      ## Install
                      **Android**: download the `.apk` below and sideload it, or distribute via MDM.
                  releaseDraft: true
                  prerelease: false
