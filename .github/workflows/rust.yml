name: Backend

on:
    push:
        branches: ["**"]
        tags:
            - "v*"
        paths:
            - "backend/**"
            - ".github/workflows/rust.yml"
    pull_request:
        branches: ["**"]
        paths:
            - "backend/**"
            - ".github/workflows/rust.yml"

env:
    CARGO_TERM_COLOR: always
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}/backend

jobs:
    build:
        name: Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: backend

            - name: Build
              working-directory: ./backend
              run: cargo build --verbose

            - name: Run tests
              working-directory: ./backend
              run: cargo test --verbose

    publish-docker:
        name: Publish Docker image
        needs: build
        # Run on main pushes and release tag pushes
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve backend release version
              id: version
              run: |
                  TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' | head -n 1 || true)"
                  if [ -n "$TAG" ]; then
                      VERSION="${TAG#v}"
                      VERSION_DOCKER="${VERSION//+/-}"
                      echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                      echo "VERSION_DOCKER=$VERSION_DOCKER" >> "$GITHUB_OUTPUT"
                      echo "OFFICIAL=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "VERSION=0.0.0-dev" >> "$GITHUB_OUTPUT"
                      echo "VERSION_DOCKER=0.0.0-dev" >> "$GITHUB_OUTPUT"
                      echo "OFFICIAL=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,prefix=sha-
                      type=raw,value=${{ steps.version.outputs.VERSION_DOCKER }},enable=${{ steps.version.outputs.OFFICIAL == 'true' }}
                      type=raw,value=latest,enable=${{ steps.version.outputs.OFFICIAL == 'true' }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
