name: Rust
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/rust.yml"
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        working-directory: ./backend
        run: cargo build --verbose

      - name: Run tests
        working-directory: ./backend
        run: cargo test --verbose
